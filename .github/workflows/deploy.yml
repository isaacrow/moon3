name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Pull requests run the checks only; nothing deploys until the change is on main.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('check-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  # Tests, type check and build. Both deploys wait for this job, so a red test or a
  # build error stops the site and the edge function from going out.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Installs exactly what package-lock.json pins, so every build uses the same packages.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # BIBFRAME conformance and serializer tests: a record that is not valid BIBFRAME never deploys.
      - name: Test
        run: npm test

      # Type errors block the deploy; unused code is reported by `npm run lint:unused` without blocking.
      - name: Type check
        run: npm run typecheck

      # The server (Deno) is checked too: it may have its old errors, but not one more than the baseline.
      - name: Type check the server
        run: npm run typecheck:server

      - name: Build
        run: |
          set -o pipefail
          npx vite build 2>&1 | tee build.log
          echo "### Vite Build Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # Applies new supabase/migrations/*.sql files to the live database before the server that uses them
  # deploys. Each file runs once, in a transaction; see scripts/apply-migrations.mjs.
  migrate-database:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: gfbagczwhvxxstbfrfhu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply migrations
        run: node scripts/apply-migrations.mjs

  # Deploys the Supabase edge function (accounts, approvals, records API).
  # Needs the SUPABASE_ACCESS_TOKEN repository secret; skipped when it is missing.
  deploy-edge-function:
    needs: [check, migrate-database]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      MOON_JOB_TOKEN: ${{ secrets.MOON_JOB_TOKEN }}
      SUPABASE_PROJECT_ID: gfbagczwhvxxstbfrfhu
    steps:
      - name: Checkout
        if: env.SUPABASE_ACCESS_TOKEN != ''
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        if: env.SUPABASE_ACCESS_TOKEN != ''
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy make-server-49c0e13c
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          # The app calls the function as make-server-49c0e13c; its source lives in functions/server.
          cp -r supabase/functions/server supabase/functions/make-server-49c0e13c
          # The CLI expects an index.ts entrypoint; the server's is index.tsx.
          echo 'import "./index.tsx";' > supabase/functions/make-server-49c0e13c/index.ts
          supabase functions deploy make-server-49c0e13c --project-ref "$SUPABASE_PROJECT_ID" --use-api --yes

      # The nightly jobs (link-records.yml) sign their calls with MOON_JOB_TOKEN; the function checks it against
      # the same value. Set from the repository secret when there is one (never printed).
      - name: Hand the job token to the function
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.MOON_JOB_TOKEN != ''
        run: supabase secrets set "MOON_JOB_TOKEN=$MOON_JOB_TOKEN" --project-ref "$SUPABASE_PROJECT_ID" --yes

      - name: Skipped (no SUPABASE_ACCESS_TOKEN secret)
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "::warning::SUPABASE_ACCESS_TOKEN secret not set - edge function was not deployed."

  deploy-pages:
    needs: check
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
