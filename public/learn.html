      h1: 'تعلّم مون', btn: 'English', glh: 'المسرد', glq: 'ابحث عن كلمة (طبعة، URI، Instance)…', min: 'دقائق',
      lede: 'عشرة دروس قصيرة، كل منها دقيقتان أو ثلاث وتمرين، ثم شهادة إتمام، في الفهرسة بـ BIBFRAME كما يعملها مون. كلها بمثال واحد يعرفه الجميع: «كليلة ودمنة»، الكتاب الذي نقله ابن المقفع إلى العربية في القرن الثاني الهجري، وله اليوم مئات الطبعات والترجمات والمخطوطات.',

      lessons: [
        { id: 'wemi', t: 'كتاب واحد، طبعات كثيرة', m: 3,
          body: '<p>في مارك كانت كل طبعة تسجيلة منفصلة تكرر المؤلف والموضوع. في BIBFRAME نفصل ثلاثة أشياء:</p><ul><li><b>العمل (Work)</b>: «كليلة ودمنة» نفسه، بمؤلفه وموضوعه ولغته. يُسجَّل مرة واحدة.</li><li><b>الطبعة (Instance)</b>: طبعة بعينها بناشرها وتاريخها وصفحاتها وردمكها.</li><li><b>النسخة (Item)</b>: النسخة التي على رف مكتبتك، برقم رفها.</li></ul>',

          moon: 'في مون: المحرر يقسم الحقول إلى العمل والطبعة والنسخ، والفهرس العام يجمع طبعات العمل الواحد تحت نتيجة واحدة («3 طبعات لهذا العمل»).' },
        { id: 'hub', t: 'الترجمات والمحور', m: 2,
          body: '<p>«كليلة ودمنة» نُقل إلى الفارسية والعبرية واللاتينية والإنجليزية وغيرها. كل ترجمة عمل قائم بنفسه (فيه المترجم ولغته)، لكنه <b>ترجمة لـ</b> الأصل.</p><p><b>المحور (Hub)</b> يجمع كل هذه الصور تحت اسم واحد، فيجد القارئ الترجمات كلها من أي واحدة منها.</p>',

          moon: 'في مون: حقل «ترجمة لـ» في العمل، وصفحة المحور في الفهرس تعرض الترجمات والطبعات معاً.' },
        { id: 'names', t: 'الاسم الواحد بشكل واحد', m: 3,
          body: '<p>يُكتب اسم ابن المقفع بأشكال كثيرة: «عبد الله بن المقفع»، «ابن المقفع»، Ibn al-Muqaffaʿ. لو كتب كل مفهرس شكلاً لتفرقت كتبه.</p><p>لذلك يكون للشخص <b>كيان</b> واحد في ملف الاستناد، له شكل مفضل لكل خط، وأشكال أخرى يُبحث بها، وروابط إلى الشخص نفسه في مكتبة الكونغرس وVIAF وويكي بيانات.</p>',
          ex: 'كيان واحد: «ابن المقفع» (بالعربية) و Ibn al-Muqaffaʿ (بالكتابة اللاتينية) ← مرتبط بالكونغرس وويكي بيانات.',
          moon: 'في مون: صفحة «الكيانات»، وزر «اربط بـ LC وVIAF وويكي بيانات». الفهرس العام يعرض ما تسمّيه به مكتبة الكونغرس وويكي بيانات.' },
        { id: 'scripts', t: 'خطّان معاً', m: 2,
          body: '<p>الفهارس العالمية تبحث بالحروف اللاتينية، والقارئ العربي يبحث بالعربية. نسجل العنوان والاسم <b>بالصيغتين</b>: العربية، وكتابتها اللاتينية على قواعد مكتبة الكونغرس (ALA-LC).</p>',
          ex: 'كليلة ودمنة = Kalīlah wa-Dimnah',
          moon: 'في مون: لوحة «الكتابة اللاتينية» تقترح الصيغة اللاتينية من أداة ScriptShifter لمكتبة الكونغرس، أو الصيغة العربية لما جاء باللاتينية وحدها، فتراجعها قبل إضافتها. وفي مارك تخرج العربية في حقل 880.' },
        { id: 'subjects', t: 'عمَّ يتحدث، وما هو', m: 2,
          body: '<p>فرق بين <b>الموضوع</b> (عمَّ يتحدث الكتاب) و<b>النوع</b> (ما هو الكتاب). «كليلة ودمنة» نوعه حكايات على ألسنة الحيوان؛ ودراسة عن «كليلة ودمنة» موضوعها الكتاب نفسه.</p><p>الاثنان من قوائم مضبوطة لا كلمات حرة، حتى يجتمع ما تحتهما.</p>',
          ex: 'النص: نوعه «حكايات». الدراسة: موضوعها «كليلة ودمنة».',
          moon: 'في مون: حقل الموضوع وحقل النوع والشكل يبحثان في قوائم مكتبة الكونغرس وملف مون.' },
        { id: 'manuscripts', t: 'المخطوط ونسخه', m: 3,
          body: '<p>في المخطوط تكون <b>النسخة</b> هي المهمة: عليها الإجازات والسماعات والتملكات والوقفيات والأختام، وقد تكون مجموعاً يضم رسائل كثيرة.</p><ul><li>الإجازة والسماع تُسجَّل <b>أحداثاً</b> على النسخة بأشخاصها وأدوارهم ومكانها وتاريخها.</li><li>الأختام والتجليد والحالة تُسجَّل في «الوصف المادي للنسخة».</li><li>المجموع: كل رسالة فيه عمل بعنوانه ومؤلفه.</li></ul>',

          moon: 'في مون: لوحة «النسخ» (أحداث النسخة ووصفها المادي) ولوحة «مجموع»، والفهرس العام يعرض الشيوخ والتلاميذ من الإجازات.' },
        { id: 'marc', t: 'من مارك إلى BIBFRAME', m: 2,
          body: '<p>إن كنت تعرف مارك فأنت تعرف أكثر مما تظن: الحقل 245 صار عنوان الطبعة، و100 صار المساهمة الرئيسة في العمل، و650 صار الموضوع، و300 صار الامتداد.</p><p>ما لا يحوّله مون بعد لا يضيع: يُحفظ كما هو ويعود عند التصدير إلى مارك.</p>',
          ex: '245 $a ← Instance › title › mainTitle',
          moon: 'في مون: صفحة <a href="/marc.html">أين حقل مارك؟</a> لكل حقل وحقل فرعي، ومحرر مارك داخل مون يحوّل فوراً إلى BIBFRAME.' },
        { id: "category", t: "الفئة والشكل والنوع", m: 2,
          body: "<p>يرى القارئ لكل كتاب <b>فئة</b> واحدة (كتاب، مخطوط، دورية، خريطة…) و<b>شكلاً</b> لكل طبعة (مطبوع، مخطوط باليد، على الإنترنت…). يستخرجهما مون مما في التسجيلة: نوع المحتوى ونوع الوسيط والحامل.</p><p>أما <b>النوع والشكل</b> (رواية، ديوان، شرح، فتاوى) فمن قائمة مون العربية المربوطة بمصطلحات مكتبة الكونغرس، فيرى القارئ العربي «رواية» حيث كُتب Novels.</p>",
          ex: "كتاب · مطبوع · العربية · شعر",
          moon: "في مون: سطر واحد تحت كل نتيجة، ووجها «الفئة» و«الشكل» في الفهرس، وقائمة <a href=\"/resource/genres-ar.ttl\">النوع والشكل العربية</a>." },
        { id: "lcworks", t: "الربط بأعمال مكتبة الكونغرس", m: 2,
          body: "<p>مكتبة الكونغرس تنشر أعمالها ومحاورها (Works وHubs) بعناوين دائمة. ربط عملك بها يجعل فهرسك جزءاً من شبكة واحدة.</p><p>يبحث مون عن كل عمل ويقيّم ما يجده: <b>المؤلف أثقل من العنوان</b>، ورقم LCCN نفسه يحسم. وأنت تقرر كل ربط.</p>",

          moon: "في مون: العمليات الفنية ‹ ربط الأعمال بمكتبة الكونغرس. المحور يصير «تعبيراً عن»، والعمل «هو نفسه»." },

    en: {
      qz: {"wemi": {"q": "Two libraries each hold a copy of the 1990 Beirut edition of Kalīlah wa-Dimnah. How many Instances?", "o": ["One, each library with its own Item", "Two, one per library", "None, the Work is enough"], "a": 0, "why": "The edition is one; what differs is the copy on each shelf."}, "hub": {"q": "An English translation of Kalīlah wa-Dimnah: how does it relate to the Arabic text?", "o": ["Another edition of it", "A work of its own, a \"translation of\" the original", "A copy of it"], "a": 1, "why": "A translation has its translator and language, so it is a work, linked to the original and the hub."}, "names": {"q": "Where do «ابن المقفع» and Ibn al-Muqaffaʿ go together?", "o": ["In each record, in the cataloguer's favourite form", "In one entity with a preferred form for each script", "In a note"], "a": 1, "why": "One entity gathers all his books, whatever the form."}, "scripts": {"q": "The title كليلة ودمنة in an Arabic record is recorded…", "o": ["In Arabic only", "Romanized only", "In both: Arabic and Kalīlah wa-Dimnah"], "a": 2, "why": "Arabic readers search in Arabic, world catalogues in Latin letters."}, "subjects": {"q": "In a study of Kalīlah wa-Dimnah, \"Kalīlah wa-Dimnah\" is its…", "o": ["Subject", "Genre/form", "Title"], "a": 0, "why": "The study is about the book, so it is its subject; its genre is a study."}, "manuscripts": {"q": "An ijāzah written on the back of a manuscript copy goes…", "o": ["In the Work", "As an event on the copy, with its people and roles", "In the edition's title"], "a": 1, "why": "The ijāzah is on this very copy, so it is an event on it."}, "marc": {"q": "MARC 300 (physical description) becomes in BIBFRAME…", "o": ["The Instance's extent", "The Work's subject", "A contribution"], "a": 0, "why": "Pages and illustrations describe the edition."}, "category": {"q": "A printed dīwān of al-Mutanabbī: its category and format in the catalogue?", "o": ["Category Book, format Printed; genre: dīwān", "Category Poetry, format Dīwān", "Category Printed, format Book"], "a": 0, "why": "Category and format are few and fixed; genre (dīwān, poetry) is another way in."}, "lcworks": {"q": "Moon suggests your work is LC's \"Kitāb al-ʻibar. Muqaddimah\" at 98. What do you do?", "o": ["It links by itself", "Check the author and title, then Link or Not this", "Copy the record"], "a": 1, "why": "Nothing is linked without a person; the score is a suggestion."}, "check": {"q": "You save a record without its content type. What happens?", "o": ["It is not saved", "It is saved, but not published until complete", "It is published, incomplete"], "a": 1, "why": "Saving always works; publishing waits for the required fields."}},
      w: {"q": "Practice", "right": "Right.", "wrong": "Not this one.", "done": "of 10 lessons done", "cert": "Certificate", "certp": "You have done all ten lessons. Write your name as you want it on the certificate; it is sent nowhere.", "name": "Your name", "print": "Print the certificate", "reset": "Start again"},
      h1: 'Learn Moon', btn: 'العربية', glh: 'Glossary', glq: 'Find a word (Instance, URI, edition)…', min: 'min',
      lede: "Ten short lessons, two or three minutes each with a practice question, then a certificate of completion, on cataloguing in BIBFRAME the way Moon does it. All with one book everyone knows: Kalīlah wa-Dimnah, which Ibn al-Muqaffaʿ brought into Arabic in the 8th century, and which has hundreds of editions, translations and manuscripts today.",
      foot: '<a href="/moon/?practice=1"><b>Practise on a copy of a real record</b></a>: what you save stays in your browser and never reaches the catalogue. In the editor, the "Simple" button shows the main fields only.<br>The Arabic text is a draft awaiting review. In the Moon editor, the "?" beside each field opens its entry from this glossary, and <a href="/marc.html">Where is my MARC field?</a> shows where each MARC field goes.',
      lessons: [
        { id: 'wemi', t: 'One book, many editions', m: 3,
          body: '<p>In MARC every edition was a separate record repeating the author and subject. BIBFRAME separates three things:</p><ul><li><b>Work</b>: Kalīlah wa-Dimnah itself, with its author, subject and language. Recorded once.</li><li><b>Instance</b>: one edition, with its publisher, date, pages and ISBN.</li><li><b>Item</b>: the copy on your library\'s shelf, with its shelf mark.</li></ul>',
          ex: 'One work, Kalīlah wa-Dimnah → many editions (Cairo, Beirut, Paris …) → copies in many libraries.',
          moon: 'In Moon: the editor groups fields into Work, Instance and copies, and the OPAC gathers the editions of one work into one result ("3 editions of this work").' },
        { id: 'hub', t: 'Translations and the hub', m: 2,
          body: '<p>Kalīlah wa-Dimnah went into Persian, Hebrew, Latin, English and more. Each translation is a work of its own (with its translator and language), and a <b>translation of</b> the original.</p><p>A <b>Hub</b> gathers all these versions under one name, so a reader finds every translation from any of them.</p>',
          ex: 'English translation → "translation of" → the Arabic text; both under the Kalīlah wa-Dimnah hub.',
          moon: 'In Moon: the Work\'s "Translation of" field, and the hub page in the OPAC listing translations and editions together.' },
        { id: 'names', t: 'One name, one form', m: 3,
          body: '<p>Ibn al-Muqaffaʿ is written many ways: «عبد الله بن المقفع», «ابن المقفع», Ibn al-Muqaffaʿ. If each cataloguer wrote their own, his books would scatter.</p><p>So the person is one <b>entity</b> in the authority file, with a preferred form for each script, other forms to search by, and links to the same person at LC, VIAF and Wikidata.</p>',
          ex: 'One entity: «ابن المقفع» (Arabic) and Ibn al-Muqaffaʿ (romanized) → linked to LC and Wikidata.',
          moon: 'In Moon: the Entities page and "Link to LC, VIAF, Wikidata". The OPAC shows what LC and Wikidata call each person.' },
        { id: 'scripts', t: 'Two scripts together', m: 2,
          body: '<p>World catalogues search in Latin letters; Arabic readers search in Arabic. Titles and names are recorded in <b>both</b>: Arabic, and its romanization by LC\'s rules (ALA-LC).</p>',
          ex: 'كليلة ودمنة = Kalīlah wa-Dimnah',
          moon: 'In Moon: the Romanization panel suggests the Latin form from LC\'s ScriptShifter, or the Arabic for values that came only romanized, for you to check. In MARC the Arabic goes in an 880.' },
        { id: 'subjects', t: 'What it is about, and what it is', m: 2,
          body: '<p><b>Subject</b> (what the book is about) is not <b>genre</b> (what the book is). Kalīlah wa-Dimnah is fables told by animals; a study of Kalīlah wa-Dimnah has the book itself as its subject.</p><p>Both come from controlled lists, not free words, so what is under them comes together.</p>',
          ex: 'The text: genre "fables". The study: subject "Kalīlah wa-Dimnah".',
          moon: 'In Moon: the Subject and Genre/form fields search LC\'s lists and Moon\'s own.' },
        { id: 'manuscripts', t: 'A manuscript and its copies', m: 3,
          body: '<p>For a manuscript, the <b>copy</b> matters most: it carries ijāzāt, samāʿāt, ownership and waqf notes and seals, and it may be a majmūʿ holding many treatises.</p><ul><li>An ijāzah or samāʿ is recorded as an <b>event</b> on the copy, with its people and their roles, place and date.</li><li>Seals, binding and condition go in the copy\'s "Physical description".</li><li>A majmūʿ: each treatise in it is a work with its own title and author.</li></ul>',
          ex: 'A manuscript copy of Kalīlah wa-Dimnah with a waqf seal, bound with two other treatises.',
          moon: 'In Moon: the Copies panel (events and physical description) and the Majmūʿ panel; the OPAC shows teachers and students from the ijāzāt.' },
        { id: 'marc', t: 'From MARC to BIBFRAME', m: 2,
          body: '<p>If you know MARC you know more than you think: 245 became the Instance\'s title, 100 the Work\'s primary contribution, 650 the subject, 300 the extent.</p><p>What Moon does not map yet is not lost: it is kept as it is and written back on MARC export.</p>',
          ex: '245 $a → Instance › title › mainTitle',
          moon: 'In Moon: <a href="/marc.html">Where is my MARC field?</a> for every field and subfield, and the MARC editor inside Moon that converts to BIBFRAME as you type.' },
        { id: "category", t: "Category, format and genre", m: 2,
          body: "<p>Readers see one <b>category</b> for each book (Book, Manuscript, Periodical, Map…) and a <b>format</b> for each edition (Printed, Handwritten, Online…). Moon works them out from what the record says: content type, media type and carrier.</p><p><b>Genre and form</b> (novel, dīwān, commentary, fatwas) come from Moon's Arabic scheme, linked to LC's terms, so an Arabic reader sees «رواية» where the record says Novels.</p>",
          ex: "Book · Printed · Arabic · Poetry",
          moon: "In Moon: one line under each result, the Category and Format facets in the catalogue, and the <a href=\"/resource/genres-ar.ttl\">Arabic genre and form terms</a>." },
        { id: "lcworks", t: "Linking to LC's Works", m: 2,
          body: "<p>The Library of Congress publishes its Works and Hubs at permanent addresses. Linking your work to them makes your catalogue part of one web.</p><p>Moon searches for each work and scores what it finds: <b>the author counts more than the title</b>, and the same LCCN settles it. You decide each link.</p>",
          ex: "Ibn Khaldūn's al-Muqaddimah → LC's Hub \"Kitāb al-ʻibar. Muqaddimah\", with the English translation below it.",
          moon: "In Moon: Technical services › Link works to LC. A Hub becomes \"expression of\", an LC Work \"same as\"." },
        { id: "check", t: "Before publishing", m: 3,
          body: "<p>A record is always saved, but not published until it has the fields LC requires, and what your library requires on top (library rules: a right ISBN, the LCCN in its form, no duplicate).</p><p>Once published, it is checked every day against the BIBFRAME Interoperability Group's shapes, which BIBFRAME systems exchange data by, and the result is public.</p>",
          ex: "No content type → saved, not yet published.",
          moon: "In Moon: the \"Saved, but not published yet\" message, the Library rules at save screen, and the <a href=\"/score.html\">scorecard</a>." },
      ],
    },
  };
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function renderGlossary() {
    var q = $('glq').value.trim().toLowerCase();
    var rows = glossary.filter(function (g) { return !q || (g.ar + ' ' + g.en + ' ' + g.key + ' ' + g.defAr + ' ' + g.defEn).toLowerCase().indexOf(q) >= 0; });
    $('gl').innerHTML = rows.map(function (g) {
      return '<dt>' + esc(lang === 'ar' ? g.ar : g.en) + ' <span class="draft">' + esc(lang === 'ar' ? g.en : g.ar) + '</span></dt><dd>' + esc(lang === 'ar' ? g.defAr : g.defEn) + '</dd>';
    }).join('');
  }
  // Practice: one question a lesson; what is answered right is kept in this browser only (moon-learn-done).
  var done = (function () { try { return JSON.parse(localStorage.getItem('moon-learn-done') || '{}') || {}; } catch (e) { return {}; } })();
  function save() { try { localStorage.setItem('moon-learn-done', JSON.stringify(done)); } catch (e) {} }
  function quiz(id, t) {
    var q = t.qz[id]; if (!q) return '';
    return '<div class="qz" data-q="' + id + '"><b>' + esc(t.w.q) + (done[id] ? ' ✓' : '') + '</b><p>' + esc(q.q) + '</p>'
      + q.o.map(function (o, i) { return '<button type="button" data-o="' + i + '">' + esc(o) + '</button>'; }).join('') + '<p class="why" hidden></p></div>';
  }
  function progress() {
    var t = L[lang], n = t.lessons.filter(function (l) { return done[l.id]; }).length;
    $('prog').textContent = n + ' ' + t.w.done;
    $('cert').hidden = n < t.lessons.length;
    $('certh').textContent = t.w.cert; $('certp').textContent = t.w.certp; $('certname').placeholder = t.w.name;
    $('certprint').textContent = t.w.print; $('certreset').textContent = t.w.reset;
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('.qz button'); if (!b) return;
    var box = b.closest('.qz'), id = box.getAttribute('data-q'), t = L[lang], q = t.qz[id], i = Number(b.getAttribute('data-o'));
    var ok = i === q.a, why = box.querySelector('.why');
    why.hidden = false; why.textContent = (ok ? t.w.right + ' ' : t.w.wrong + ' ') + (ok ? q.why : '');
    box.querySelectorAll('button').forEach(function (x) { x.classList.remove('ok', 'no'); });
    b.classList.add(ok ? 'ok' : 'no');
    if (ok && !done[id]) { done[id] = true; save(); box.querySelector('b').textContent = t.w.q + ' ✓'; progress(); }
  });
  function printCertificate() {
    var name = $('certname').value.trim(); if (!name) { $('certname').focus(); return; }
    var w = window.open('', '_blank'); if (!w) return;
    var day = new Date().toISOString().slice(0, 10);
    w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Moon certificate</title><style>body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;text-align:center;padding:12mm}.c{border:3px double #1d1d1f;padding:16mm 12mm;min-height:150mm}h1{font-family:"Noto Naskh Arabic",serif;font-size:34px;margin:0 0 6mm}.n{font-size:30px;font-weight:700;margin:10mm 0}.s{color:#4a4a4f}</style></head><body><div class="c">'
      + '<img src="/opac-logo.png" alt="" style="height:60px"><h1>شهادة إتمام · Certificate of completion</h1>'
      + '<p dir="rtl">أتمّ الدروس العشرة في الفهرسة بـ BIBFRAME في مون، وأجاب عن تمارينها.</p><div class="n" dir="auto">' + esc(name) + '</div>'
      + '<p>has completed the ten lessons in BIBFRAME cataloguing in Moon, with their practice questions.</p>'
      + '<p class="s">' + day + ' · mooon.site/learn.html</p><p class="s" style="font-size:12px">A self-paced course; this certificate shows completion, not an assessment by an institution. · دورة ذاتية؛ تشهد هذه الشهادة بالإتمام، لا بتقييم من مؤسسة.</p>'
      + '</div><script>window.onload=function(){window.print()}<\/script></body></html>');
    w.document.close();
  }
  function render() {
    var t = L[lang];
    document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    $('h1').textContent = t.h1; $('lang').textContent = t.btn; $('lede').textContent = t.lede; $('glh').textContent = t.glh;
    $('glq').placeholder = t.glq; $('foot').innerHTML = t.foot;
    $('toc').innerHTML = t.lessons.map(function (l, i) { return '<a href="#' + l.id + '">' + (i + 1) + '. ' + esc(l.t) + '</a>'; }).join('') + '<a href="#glossary">' + t.glh + '</a>';
    $('lessons').innerHTML = t.lessons.map(function (l, i) {
      return '<section class="lesson glass" id="' + l.id + '"><h2>' + (i + 1) + '. ' + esc(l.t) + '</h2><div class="time">' + (lang === 'ar' ? (l.m === 2 ? 'دقيقتان' : l.m + ' دقائق') : l.m + ' min') + '</div>' + l.body
        + '<div class="ex">' + esc(l.ex) + '</div><p class="inmoon">' + l.moon + '</p>' + quiz(l.id, t) + '</section>';
    }).join('');
    progress();
    renderGlossary();
  }
  $('lang').addEventListener('click', function () { lang = lang === 'ar' ? 'en' : 'ar'; try { localStorage.setItem('moon-learn-lang', lang); } catch (e) {} render(); });
  $('glq').addEventListener('input', renderGlossary);
  $('certprint').addEventListener('click', printCertificate);
  $('certreset').addEventListener('click', function () { done = {}; save(); render(); });
  fetch('/glossary.json').then(function (r) { return r.json(); }).then(function (g) { glossary = g; renderGlossary(); }).catch(function () {});
  render();
})();
</script>
