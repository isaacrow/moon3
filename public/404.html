<title>Not found · Moon</title>
<script>
  // An ontology term's address (https://mooon.site/ontology/<Term>) without a page of its own goes to its place
  // on the ontology page.
  (function () {
    var m = location.pathname.match(/^\/ontology\/([A-Za-z][A-Za-z0-9]*)\/?$/);
    if (m) location.replace('/ontology/#' + m[1]);
  })();
</script>
